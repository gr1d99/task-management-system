services:
  postgres:
    image: postgres
    container_name: TMS.DB
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - db:/data/postgres
    networks:
      - tms
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 30s
      timeout: 10s
      retries: 5
networks:
  tms:
    driver: bridge
volumes:
  db:
